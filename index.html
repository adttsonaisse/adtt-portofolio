<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="text-scale" content="scale" />
    <meta
      name="description"
      content="Portfolio of Aditya Nurdiansyah, Indonesian-based Software Engineer crafting editorial-grade engineering."
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/adtt-600.avif 600w, /adtt.avif 900w"
      imagesizes="(max-width: 767px) 340px, (max-width: 1023px) 500px, 580px"
      fetchpriority="high"
    />
    <title>Aditya Nurdiansyah — Software Engineer</title>
    <script>
      (function () {
        try {
          var localeStored = localStorage.getItem('locale');
          var locale = localeStored === 'en' || localeStored === 'id' ? localeStored : null;
          if (!locale) {
            var nav = (navigator.language || 'en').toLowerCase();
            locale = nav.indexOf('id') === 0 ? 'id' : 'en';
          }
          document.documentElement.setAttribute('lang', locale);
        } catch (e) {
          document.documentElement.setAttribute('lang', 'en');
        }
        try {
          var themeStored = localStorage.getItem('theme');
          var theme = themeStored || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
